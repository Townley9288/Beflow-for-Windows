name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore tests/BBDownForWindows.Core.Tests/BBDownForWindows.Core.Tests.csproj --locked-mode
      - run: dotnet test tests/BBDownForWindows.Core.Tests/BBDownForWindows.Core.Tests.csproj -c Release --no-restore

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore BBDown-for-Windows.sln --locked-mode
      - name: Test Windows solution
        shell: pwsh
        run: dotnet test BBDown-for-Windows.sln -c Release -p:Platform=x64 --no-restore
      - name: Build WinUI app
        shell: pwsh
        run: dotnet build src\BBDownForWindows.App\BBDownForWindows.App.csproj -c Release -p:Platform=x64 --no-restore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-core]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.5.4 --allow-downgrade --yes --no-progress
      - name: Build release artifacts
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          FFMPEG_ARCHIVE_URL: ${{ vars.FFMPEG_ARCHIVE_URL }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          .\scripts\Build-Release.ps1 -Version $version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Beflow-for-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            artifacts/release/*-setup.exe
            artifacts/release/*-setup.exe.sha256
            artifacts/release/*-portable.zip
            artifacts/release/*-portable.zip.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/release/*-setup.exe
            artifacts/release/*-setup.exe.sha256
            artifacts/release/*-portable.zip
            artifacts/release/*-portable.zip.sha256
          body_path: RELEASE_NOTES.md
